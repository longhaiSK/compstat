# Created 2026-09-26 by gen_shinyapps.py when the apps were moved out of the
# book; hand-maintained from here on -- the sidebar below is the list.
#
# A website sub-project whose only job is to publish the book's Shinylive
# apps as one standalone page each. Sources and rendered pages share this
# directory (output-dir: .), exactly as the book does at the repo root, so
# rendering the archive can never touch the book's own index.html,
# search.json or site_libs/ one level up.
project:
  type: website
  output-dir: .
  render:
    - "*.qmd"

website:
  title: "Shinylive Apps for Statistical Computation"
  search: false
  page-navigation: true
  sidebar:
    style: docked
    collapse-level: 1
    contents:
      - href: index.qmd
        text: "All apps"
      - section: "Random Numbers and Monte Carlo Methods"
        contents:
          - href: app_inverse-cdf.qmd
            text: "The Inverse CDF Method"
      - section: "Optimization for Maximum Likelihood Estimation"
        contents:
          - href: app_nr-divergence.qmd
            text: "Safeguarded Newton-Raphson"
          - href: app_gradient-methods.qmd
            text: "Comparing Gradient Descent and Newton-Raphson Optimization Algorithms"
          - href: app_nelder-mead.qmd
            text: "Nelder–Mead"
          - href: app_sgd.qmd
            text: "Stochastic Gradient Descent"
      - section: "EM Algorithms"
        contents:
          - href: app_mixture.qmd
            text: "The EM Algorithm for a Normal Mixture"
      - section: "Introduction to Bayesian Inference"
        contents:
          - href: app_bayes-explorer.qmd
            text: "Conjugate Bayesian Updating"
      - section: "Numerical Quadrature"
        contents:
          - href: app_missed-mode-nq.qmd
            text: "A Quadrature Grid Missing the Posterior Mode"
      - section: "Laplace Approximation"
        contents:
          - href: app_laplace-transform.qmd
            text: "Adaptive Gauss–Hermite Quadrature"
      - section: "Rejection Sampling"
        contents:
          - href: app_rejection.qmd
            text: "Envelope Tightness in Rejection Sampling"
          - href: app_gamma-rejection.qmd
            text: "Rejection Sampling from a Gamma Density with a Cauchy Envelope"
          - href: app_ars.qmd
            text: "Adaptive Rejection Sampling"
      - section: "Importance Sampling"
        contents:
          - href: app_missed-mode.qmd
            text: "The Failure of Importance Sampling"
          - href: app_t-is.qmd
            text: "Importance Sampling of a Student-t Interval"
          - href: app_marlik.qmd
            text: "Sorted Importance Weights"
      - section: "Markov Chain Monte Carlo"
        contents:
          - href: app_hmc.qmd
            text: "Hamiltonian Monte Carlo Tuning"

filters:
  - shinylive

format:
  html:
    theme: [cosmo, styles.scss]
    toc: false
    # These pages are app viewers, not prose: the default article column
    # squeezes a sidebarLayout app into half the window and leaves the
    # rest of the screen empty.
    page-layout: full
    embed-resources: false   # shinylive cannot run in a self-contained file
    link-external-newwindow: true
