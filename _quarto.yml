# One-page landing site for the course. The book, slides and apps are
# separate Quarto projects in their own folders and are not rendered here.
project:
  type: website
  output-dir: .
  render:
    - index.qmd
    - syllabi/*.qmd

website:
  title: "Professor Longhai Li"
  navbar:
    logo: _extensions/profweb/logo.png
    logo-href: https://longhaisk.github.io/
    title: "Professor Longhai Li"
    background: "#c5c5c5"
    foreground: royalblue
    position: fixed-top
    collapse-below: md
    right:
      - text: Home
        href: https://longhaisk.github.io/index.html
      - text: Research
        href: https://longhaisk.github.io/research.html
      - text: Courses
        href: https://longhaisk.github.io/teaching.html
