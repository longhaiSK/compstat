title: Custom Book Format
author: Longhai Li
version: 1.0.0
quarto-required: ">=1.3.0"
contributes:
  formats:
    html:
      theme:
        - cosmo
        - mathenvs.scss
      self-contained: false
      page-layout: full
      page-navigation: false
      toc: true
      toc-location: left
      toc-depth: 4
      sidebar:
        style: "docked"
        search: true
        collapse-level: 1
        contents: auto
      echo: true
      code-fold: true
      number-sections: true
      df-print: paged
      highlight-style: tango
      filters:
        - deps.lua
        - bookstyles.lua
    pdf:
      always_allow_html: true
      toc: true
      toc-depth: 3
      number-sections: true
      colorlinks: true
      echo: true
      # Keep every figure where it appears in the text. A figure left floating
      # while a longtable (a Markdown table) starts on the same page makes
      # LaTeX push the rest of that page below the bottom margin.
      fig-pos: H
      mainfont: "Times New Roman"
      geometry:
        - top=25mm
        - left=20mm
        - right=20mm
      include-in-header: header.tex
      filters:
        - bookstyles.lua
        - path: gt-latex.lua
          at: pre-quarto
