<!-- Adds a way back to the slides index (index.html) to the reveal.js
     slide menu: a toolbar button and a link at the top of the slide list. -->
<style>
  .slide-menu-all-presentations a {
    display: block;
    padding: 8px 12px;
    font-weight: bold;
    color: #fff;
    text-decoration: none;
    border-bottom: 1px solid #555;
  }
  .slide-menu-all-presentations a:hover { background: #2a2a2a; }
  /* Quarto draws menu toolbar icons as inline SVGs keyed by class; add one for the house icon */
  .slide-menu-wrapper .slide-menu-toolbar .fa-home::before {
    background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="white" viewBox="0 0 16 16"><path d="M8.354 1.146a.5.5 0 0 0-.708 0l-6 6A.5.5 0 0 0 1.5 7.5v7a.5.5 0 0 0 .5.5h4.5a.5.5 0 0 0 .5-.5v-4h2v4a.5.5 0 0 0 .5.5H14a.5.5 0 0 0 .5-.5v-7a.5.5 0 0 0-.146-.354L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293L8.354 1.146zM2.5 14V7.707l5.5-5.5 5.5 5.5V14H10v-4a.5.5 0 0 0-.5-.5h-3a.5.5 0 0 0-.5.5v4H2.5z"/></svg>');
  }
</style>
<script>
(function () {
  var INDEX = "index.html";

  function addEntries() {
    var toolbar = document.querySelector(".slide-menu-toolbar");
    var slides = document.querySelector('.slide-menu-panel[data-panel="Slides"]');
    if (!toolbar || !slides) return false;
    if (document.getElementById("all-presentations")) return true;

    var btn = document.createElement("li");
    btn.id = "all-presentations";
    btn.className = "toolbar-panel-button";
    btn.title = "Back to All Presentations";
    btn.innerHTML = '<i class="fas fa-home"></i><br>' +
      '<span class="slide-menu-toolbar-label">All Slides</span>';
    btn.addEventListener("click", function () { window.location.href = INDEX; });
    toolbar.insertBefore(btn, document.getElementById("close"));

    var link = document.createElement("div");
    link.className = "slide-menu-all-presentations";
    link.innerHTML = '<a href="' + INDEX + '">&larr; Back to All Presentations</a>';
    slides.insertBefore(link, slides.firstChild);
    return true;
  }

  // The menu plugin builds its sidebar during Reveal's initialisation.
  function waitForMenu(tries) {
    if (!addEntries() && tries > 0) setTimeout(function () { waitForMenu(tries - 1); }, 100);
  }
  if (window.Reveal && Reveal.isReady && Reveal.isReady()) waitForMenu(50);
  else if (window.Reveal) Reveal.on("ready", function () { waitForMenu(50); });
  else window.addEventListener("load", function () { waitForMenu(50); });
})();
</script>
